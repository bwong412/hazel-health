<!DOCTYPE html>
<html lang="zh-HANT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>散步打卡 - Hazel’s Website 🐾</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    .apple-glass { background: rgba(22, 22, 23, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  </style>
</head>
<body class="bg-[#000000] text-[#f5f5f7] min-h-screen">

  <nav class="fixed top-0 left-0 w-full z-50 apple-glass border-b border-[#424245]/50">
    <div class="max-w-4xl mx-auto px-4 h-12 flex items-center justify-between text-xs text-[#ceced2] overflow-x-auto">
      <div class="flex items-center gap-5 min-w-max">
        <a href="index.html" class="hover:text-white transition-colors"><span>🐾</span> <span>Hazel</span></a>
        <a href="potty.html" class="text-white font-semibold hover:text-amber-400 transition-colors">散步打卡</a>
        <a href="medical.html" class="hover:text-white transition-colors">醫療紀錄</a>
        <a href="allergies.html" class="hover:text-white transition-colors">過敏報告</a>
        <a href="weight.html" class="hover:text-white transition-colors">體重追蹤</a>
        <a href="milestones.html" class="hover:text-white transition-colors">里程碑</a>
      </div>
      <select id="user-selector" class="bg-[#1d1d1f] border border-[#424245] text-amber-300 text-[11px] rounded-lg px-2 py-1 focus:outline-none">
        <option value="👨‍💻 Dad">👨‍💻 Dad (@bwson.w)</option>
        <option value="👩‍🌾 Mum">👩‍🌾 Mum (@lcu_l)</option>
      </select>
    </div>
  </nav>

  <div class="pt-20 pb-16 px-4 max-w-4xl mx-auto space-y-6">
    <div class="bg-[#161617] border border-[#333336] rounded-3xl p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-2xl font-bold text-white">💩 散步與排泄打卡</h2>
          <p class="text-xs text-[#86868b] mt-1">雙人雲端即時同步機制</p>
        </div>
        <span class="text-xs bg-amber-500/10 text-amber-400 px-3 py-1 rounded-full border border-amber-500/20">Supabase 雲端</span>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <button type="button" id="add-pee" class="py-6 bg-[#1c1c1e] hover:bg-[#2c2c2e] active:scale-98 border border-[#38383a] rounded-2xl text-blue-400 text-sm font-medium transition-all flex flex-col items-center gap-1 cursor-pointer">
          <span class="text-xs text-[#86868b]">💧 小便計數</span>
          <span class="text-4xl font-bold"><span id="pee-count">0</span> 次</span>
        </button>
        <button type="button" id="add-poop" class="py-6 bg-[#1c1c1e] hover:bg-[#2c2c2e] active:scale-98 border border-[#38383a] rounded-2xl text-amber-400 text-sm font-medium transition-all flex flex-col items-center gap-1 cursor-pointer">
          <span class="text-xs text-[#86868b]">💩 便便計數</span>
          <span class="text-4xl font-bold"><span id="poop-count">0</span> 次</span>
        </button>
      </div>

      <div class="mb-4">
        <label class="text-xs text-[#86868b] mb-1 block">便便狀態備註：</label>
        <select id="poop-status" class="w-full bg-[#1c1c1e] border border-[#38383a] rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-amber-400">
          <option value="🟢 正常條狀">🟢 正常條狀</option>
          <option value="🟡 偏軟便">🟡 偏軟便</option>
          <option value="🔴 拉稀/帶血">🔴 拉稀 / 帶血</option>
        </select>
      </div>

      <button type="button" id="save-log" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 active:scale-98 text-black font-bold rounded-xl text-xs transition-all shadow-lg cursor-pointer">
        上傳並儲存本次散步紀錄
      </button>

      <div class="mt-6 pt-4 border-t border-[#333336]">
        <p class="text-xs text-[#86868b] mb-3">📋 最近雲端打卡動態：</p>
        <div id="logs-list" class="space-y-2 text-xs">載入雲端紀錄中...</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mggufqacuwelmrnneiyp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o7QQb_8b9pP1rOXJoyIOLQ_r4mzoSJh";

    let peeCount = 0;
    let poopCount = 0;

    document.getElementById('add-pee').onclick = () => { peeCount++; document.getElementById('pee-count').innerText = peeCount; };
    document.getElementById('add-poop').onclick = () => { poopCount++; document.getElementById('poop-count').innerText = poopCount; };

    // 載入雲端打卡列表
    async function loadCloudLogs() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/walk_poop_logs?select=*&order=created_at.desc&limit=15`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();
        const container = document.getElementById('logs-list');

        if (!data || data.length === 0) {
          container.innerHTML = `<p class="text-[#86868b] text-center py-2">今天還沒有散步紀錄喔！</p>`;
          return;
        }

        container.innerHTML = data.map(item => `
          <div class="bg-[#1c1c1e] p-3 rounded-xl border border-[#38383a] flex justify-between items-center">
            <div>
              <span class="text-amber-400 font-medium">${item.logged_by || 'Family'}</span>
              <span class="text-[#ceced2] ml-2">打卡：💧 ${item.pee_count} 次 | 💩 ${item.poop_count} 次 (${item.poop_status})</span>
            </div>
            <span class="text-[10px] text-[#86868b]">${new Date(item.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
          </div>
        `).join('');
      } catch(e) { console.log('Load logs error', e); }
    }

    // 儲存至雲端
    document.getElementById('save-log').onclick = async function() {
      if (peeCount === 0 && poopCount === 0) { alert("請先點擊小便或便便計數！"); return; }

      const user = document.getElementById('user-selector').value;
      const status = document.getElementById('poop-status').value;

      const res = await fetch(`${SUPABASE_URL}/rest/v1/walk_poop_logs`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        },
        body: JSON.stringify({ pee_count: peeCount, poop_count: poopCount, poop_status: status, logged_by: user })
      });

      if (res.ok) {
        alert("✨ 散步紀錄已成功同步至雲端！");
        peeCount = 0; poopCount = 0;
        document.getElementById('pee-count').innerText = 0;
        document.getElementById('poop-count').innerText = 0;
        loadCloudLogs();
      } else {
        alert("儲存失敗，請重試！");
      }
    };

    window.onload = loadCloudLogs;
  </script>
</body>
</html>
