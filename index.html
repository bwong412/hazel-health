<!DOCTYPE html>
<html lang="zh-HANT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hazel’s Website - Apple Style 🐾</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; }
    .apple-glass { background: rgba(22, 22, 23, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  </style>
</head>
<body class="bg-[#000000] text-[#f5f5f7] min-h-screen selection:bg-amber-500 selection:text-black">

  <!-- 頂部獨立分頁導覽列 -->
  <nav class="fixed top-0 left-0 w-full z-50 apple-glass border-b border-[#424245]/50">
    <div class="max-w-4xl mx-auto px-4 h-12 flex items-center justify-between text-xs text-[#ceced2] font-normal overflow-x-auto">
      <div class="flex items-center gap-5 min-w-max">
        <a href="index.html" class="text-white hover:text-amber-400 font-semibold transition-colors flex items-center gap-1.5">
          <span>🐾</span> <span>Hazel</span>
        </a>
        <a href="potty.html" class="hover:text-white transition-colors">散步打卡</a>
        <a href="medical.html" class="hover:text-white transition-colors">醫療紀錄</a>
        <a href="allergies.html" class="hover:text-white transition-colors">過敏報告</a>
        <a href="weight.html" class="hover:text-white transition-colors">體重追蹤</a>
        <a href="milestones.html" class="hover:text-white transition-colors">里程碑</a>
      </div>
      
      <select id="user-selector" class="bg-[#1d1d1f] border border-[#424245] text-amber-300 text-[11px] rounded-lg px-2 py-1 focus:outline-none">
        <option value="Hazel's Dad">👨‍💻 Dad (@bwson.w)</option>
        <option value="Hazel's Mum">👩‍🌾 Mum (@lcu_l)</option>
      </select>
    </div>
  </nav>

  <div class="pt-20 pb-16 px-4 max-w-4xl mx-auto space-y-8">
    <div class="relative overflow-hidden rounded-3xl bg-[#161617] border border-[#333336] shadow-2xl group">
      <div id="photo-container" class="w-full h-72 md:h-96 bg-gradient-to-tr from-amber-500/20 via-slate-900 to-black flex items-center justify-center bg-cover bg-center transition-all duration-500">
        <div id="default-avatar" class="text-center p-6">
          <div class="w-24 h-24 mx-auto mb-3 rounded-full bg-amber-500/20 border-2 border-amber-400/50 flex items-center justify-center text-5xl shadow-[0_0_30px_rgba(251,191,36,0.3)]">🐶</div>
          <span class="text-xs uppercase tracking-widest text-amber-400 font-semibold">Macau Labrador Retriever</span>
        </div>
      </div>

      <label for="photo-upload" class="absolute top-4 right-4 bg-black/60 hover:bg-black/90 backdrop-blur-md text-white text-xs px-3 py-1.5 rounded-full border border-white/20 cursor-pointer transition-all flex items-center gap-1.5 shadow-lg">
        📷 <span id="upload-status">更換相片 (雲端同步)</span>
        <input type="file" id="photo-upload" accept="image/*" class="hidden">
      </label>
    </div>

    <div>
      <h1 class="text-4xl md:text-6xl font-bold tracking-tight mb-4 text-white">Hazel’s Website</h1>
      <p class="text-base md:text-lg text-[#86868b] leading-relaxed font-normal">
        這裡是一個充滿愛心的小角落，專屬於我們的狗狗 Hazel 🐶。她在 2025 年正式加入我們的家庭，本來以為是一隻金毛，結果卻是可愛的拉布拉多，帶來了更多驚喜與歡笑。在這個網站，你可以找到 Hazel 的所有生活點滴：她的故事、照片、健康記錄，還有我們每天的溫馨分享。希望大家能一起陪伴她、喜歡她，送上滿滿的祝福，願 Hazel 永遠健康快樂 💖。
      </p>
    </div>

    <div class="p-4 bg-[#1c1c1e] rounded-2xl border border-[#38383a]">
      <p class="text-xs text-amber-300 font-medium flex items-center gap-2">
        <span>✨ 開場標語：</span> 「歡迎來到 Hazel 的小天地～一起感受她的笑容與搖尾巴的幸福！」
      </p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mggufqacuwelmrnneiyp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o7QQb_8b9pP1rOXJoyIOLQ_r4mzoSJh";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const photoUpload = document.getElementById('photo-upload');
    const photoContainer = document.getElementById('photo-container');
    const defaultAvatar = document.getElementById('default-avatar');

    async function loadCloudPhoto() {
      const { data } = await supabase.from('site_settings').select('value').eq('key', 'hazel_hero_photo').single();
      if (data && data.value) {
        photoContainer.style.backgroundImage = `url(${data.value})`;
        defaultAvatar.classList.add('hidden');
      }
    }

    photoUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('upload-status').innerText = '上傳中...';
        const reader = new FileReader();
        reader.onload = async function(event) {
          const imgData = event.target.result;
          photoContainer.style.backgroundImage = `url(${imgData})`;
          defaultAvatar.classList.add('hidden');
          await supabase.from('site_settings').upsert({ key: 'hazel_hero_photo', value: imgData });
          document.getElementById('upload-status').innerText = '更換相片 (雲端同步)';
          alert('相片已成功儲存至 Supabase 雲端！女朋友打開網頁也能看到了。');
        };
        reader.readAsDataURL(file);
      }
    });

    loadCloudPhoto();
  </script>
</body>
</html>
