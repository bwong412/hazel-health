<!DOCTYPE html>
<html lang="zh-HANT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hazel’s Website 🐾</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    .apple-glass { background: rgba(22, 22, 23, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  </style>
</head>
<body class="bg-[#000000] text-[#f5f5f7] min-h-screen">

  <nav class="fixed top-0 left-0 w-full z-50 apple-glass border-b border-[#424245]/50">
    <div class="max-w-4xl mx-auto px-4 h-12 flex items-center justify-between text-xs text-[#ceced2] overflow-x-auto">
      <div class="flex items-center gap-5 min-w-max">
        <a href="index.html" class="text-white font-semibold flex items-center gap-1.5"><span>🐾</span> <span>Hazel</span></a>
        <a href="potty.html" class="hover:text-white transition-colors">散步打卡</a>
        <a href="medical.html" class="hover:text-white transition-colors">醫療紀錄</a>
        <a href="allergies.html" class="hover:text-white transition-colors">過敏報告</a>
        <a href="weight.html" class="hover:text-white transition-colors">體重追蹤</a>
        <a href="milestones.html" class="hover:text-white transition-colors">里程碑</a>
      </div>
    </div>
  </nav>

  <div class="pt-20 pb-16 px-4 max-w-4xl mx-auto space-y-8">
    <div class="relative overflow-hidden rounded-3xl bg-[#161617] border border-[#333336] shadow-2xl">
      
      <!-- 相片容器 (支援自由拖拉) -->
      <div id="photo-container" class="w-full h-72 md:h-96 bg-gradient-to-tr from-amber-500/20 via-slate-900 to-black flex items-center justify-center bg-cover cursor-grab active:cursor-grabbing select-none relative" style="background-position: 50% 50%;">
        
        <div id="default-avatar" class="text-center p-6 pointer-events-none">
          <div class="w-24 h-24 mx-auto mb-3 rounded-full bg-amber-500/20 border-2 border-amber-400/50 flex items-center justify-center text-5xl">🐶</div>
          <span class="text-xs uppercase tracking-widest text-amber-400 font-semibold">Macau Labrador Retriever</span>
        </div>

        <!-- 拖拉提示浮標 -->
        <div id="drag-hint" class="hidden absolute bottom-4 left-4 bg-black/60 backdrop-blur-md text-amber-300 text-[11px] px-3 py-1 rounded-full border border-amber-400/30 pointer-events-none">
          🖐️ 可以在照片上直接按住拖動位置
        </div>
      </div>

      <!-- 右上角上傳按鈕 -->
      <div class="absolute top-4 right-4 flex items-center gap-2">
        <label for="photo-upload" class="bg-black/70 hover:bg-black/90 backdrop-blur-md text-white text-xs px-3 py-1.5 rounded-full border border-white/20 cursor-pointer flex items-center gap-1.5 shadow-lg">
          📷 <span id="upload-status">更換相片</span>
          <input type="file" id="photo-upload" accept="image/*" class="hidden">
        </label>
      </div>

    </div>

    <div>
      <h1 class="text-4xl md:text-6xl font-bold tracking-tight mb-4 text-white">Hazel’s Website</h1>
      <p class="text-base md:text-lg text-[#86868b] leading-relaxed">
        這裡是一個充滿愛心的小角落，專屬於我們的狗狗 Hazel 🐶。她在 2025 年正式加入我們的家庭，本來以為是一隻金毛，結果卻是可愛的拉布拉多，帶來了更多驚喜與歡笑。在這個網站，你可以找到 Hazel 的所有生活點滴：她的故事、照片、健康記錄，還有我們每天的溫馨分享。希望大家能一起陪伴她、喜歡她，送上滿滿的祝福，願 Hazel 永遠健康快樂 💖。
      </p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mggufqacuwelmrnneiyp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o7QQb_8b9pP1rOXJoyIOLQ_r4mzoSJh";

    const container = document.getElementById('photo-container');
    const dragHint = document.getElementById('drag-hint');

    let isDragging = false;
    let startX = 0, startY = 0;
    let posX = 50, posY = 50; // 預設 50% 50%
    let saveTimeout = null;

    // 載入相片與位置
    async function loadCloudPhoto() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/site_settings?key=in.(hazel_hero_photo,hazel_hero_pos)`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();
        
        let photoData = null, posData = '50% 50%';
        if (data && data.length > 0) {
          data.forEach(item => {
            if (item.key === 'hazel_hero_photo') photoData = item.value;
            if (item.key === 'hazel_hero_pos') posData = item.value;
          });
        }

        if (photoData) {
          container.style.backgroundImage = `url(${photoData})`;
          container.style.backgroundPosition = posData;
          document.getElementById('default-avatar').classList.add('hidden');
          dragHint.classList.remove('hidden');

          // 解析預設座標 (如 "35% 60%")
          const parts = posData.replace(/%/g, '').split(' ');
          if (parts.length === 2) {
            posX = parseFloat(parts[0]) || 50;
            posY = parseFloat(parts[1]) || 50;
          }
        }
      } catch(e) { console.log('Load photo error', e); }
    }

    // --- 滑鼠 & 手指觸控 自由拖拉邏輯 ---
    function startDrag(clientX, clientY) {
      isDragging = true;
      startX = clientX;
      startY = clientY;
    }

    function moveDrag(clientX, clientY) {
      if (!isDragging) return;
      const deltaX = (clientX - startX) * 0.15; // 拖動敏感度
      const deltaY = (clientY - startY) * 0.15;

      // 限制 0% ~ 100% 範圍
      posX = Math.min(100, Math.max(0, posX - deltaX));
      posY = Math.min(100, Math.max(0, posY - deltaY));

      const newPos = `${posX.toFixed(1)}% ${posY.toFixed(1)}%`;
      container.style.backgroundPosition = newPos;

      startX = clientX;
      startY = clientY;

      // 防抖儲存至 Supabase 雲端 (停止拖拉 1 秒後寫入)
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(savePositionToCloud, 1000);
    }

    function stopDrag() {
      if (isDragging) {
        isDragging = false;
        savePositionToCloud();
      }
    }

    // 滑鼠事件
    container.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', stopDrag);

    // 手指觸控事件 (Mobile Touch)
    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchend', stopDrag);

    // 將位置儲存至 Supabase
    async function savePositionToCloud() {
      const posStr = `${posX.toFixed(1)}% ${posY.toFixed(1)}%`;
      await fetch(`${SUPABASE_URL}/rest/v1/site_settings`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify({ key: 'hazel_hero_pos', value: posStr })
      });
    }

    // 上傳相片（正向 Canvas 渲染）
    document.getElementById('photo-upload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('upload-status').innerText = '處理中...';

      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const max_size = 800;
        let width = img.width, height = img.height;

        if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
        else { if (height > max_size) { width *= max_size / height; height = max_size; } }

        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);

        // 寫入 Supabase
        fetch(`${SUPABASE_URL}/rest/v1/site_settings`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify({ key: 'hazel_hero_photo', value: compressedBase64 })
        }).then(res => {
          if(res.ok) {
            alert('✨ 相片上傳成功！現在你可以直接用手指或滑鼠在照片上【按住拖動】，微調到最佳位置。');
            container.style.backgroundImage = `url(${compressedBase64})`;
            posX = 50; posY = 50;
            container.style.backgroundPosition = '50% 50%';
            document.getElementById('default-avatar').classList.add('hidden');
            dragHint.classList.remove('hidden');
          } else {
            alert('上傳失敗，請重試！');
          }
          document.getElementById('upload-status').innerText = '更換相片';
        });
      };

      const reader = new FileReader();
      reader.onload = (event) => { img.src = event.target.result; };
      reader.readAsDataURL(file);
    });

    window.onload = loadCloudPhoto;
  </script>
</body>
</html>
