<!DOCTYPE html>
<html lang="zh-HANT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>醫療紀錄 - Hazel’s Website 🐾</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    .apple-glass { background: rgba(22, 22, 23, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  </style>
</head>
<body class="bg-[#000000] text-[#f5f5f7] min-h-screen">

  <nav class="fixed top-0 left-0 w-full z-50 apple-glass border-b border-[#424245]/50">
    <div class="max-w-4xl mx-auto px-4 h-12 flex items-center justify-between text-xs text-[#ceced2] overflow-x-auto">
      <div class="flex items-center gap-5 min-w-max">
        <a href="index.html" class="hover:text-white transition-colors"><span>🐾</span> <span>Hazel</span></a>
        <a href="potty.html" class="hover:text-white transition-colors">散步打卡</a>
        <a href="medical.html" class="text-white font-semibold hover:text-amber-400 transition-colors">醫療紀錄</a>
        <a href="allergies.html" class="hover:text-white transition-colors">過敏報告</a>
        <a href="weight.html" class="hover:text-white transition-colors">體重追蹤</a>
        <a href="milestones.html" class="hover:text-white transition-colors">里程碑</a>
      </div>
    </div>
  </nav>

  <div class="pt-20 pb-16 px-4 max-w-4xl mx-auto space-y-6">
    <div class="bg-[#161617] border border-[#333336] rounded-3xl p-6 shadow-2xl space-y-6">
      <div>
        <h2 class="text-2xl font-bold text-white">🏥 看診與診療歷史</h2>
        <p class="text-xs text-[#86868b] mt-1">紀錄 Hazel 的看診原因、費用與診所地點，雙人雲端同步</p>
      </div>

      <!-- 手動新增表單 -->
      <div class="bg-[#1c1c1e] p-4 rounded-2xl border border-[#38383a]">
        <h3 class="text-xs font-semibold text-amber-300 mb-3 flex items-center gap-1.5">📝 新增看診紀錄</h3>
        <div class="space-y-3 mb-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-[10px] text-[#86868b] mb-1 block">看診日期：</label>
              <input type="text" id="med-date" placeholder="例如: 2026.09.22" class="w-full bg-[#2c2c2e] border border-[#38383a] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
            </div>
            <div>
              <label class="text-[10px] text-[#86868b] mb-1 block">診療原因 / 項目：</label>
              <input type="text" id="med-title" placeholder="例如: 🦴 右腳跛、照 X-Ray" class="w-full bg-[#2c2c2e] border border-[#38383a] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-[10px] text-[#86868b] mb-1 block">📍 看診診所 / 地點：</label>
              <input type="text" id="med-location" placeholder="例如: 皇家診所 (皇朝)" class="w-full bg-[#2c2c2e] border border-[#38383a] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
            </div>
            <div>
              <label class="text-[10px] text-[#86868b] mb-1 block">費用 (MOP)：</label>
              <input type="text" id="med-cost" placeholder="例如: 1,400 MOP" class="w-full bg-[#2c2c2e] border border-[#38383a] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
            </div>
          </div>
        </div>
        <button type="button" id="save-medical" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-bold rounded-xl text-xs transition-all cursor-pointer">
          上傳並儲存看診紀錄至雲端
        </button>
      </div>

      <!-- 列表展示區塊 -->
      <div id="medical-list" class="space-y-3 text-xs">載入醫療紀錄中...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://mggufqacuwelmrnneiyp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o7QQb_8b9pP1rOXJoyIOLQ_r4mzoSJh";

    // 載入醫療紀錄 (使用獨立的 medical_logs 資料表)
    async function loadCloudMedical() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/medical_logs?select=*&order=created_at.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();
        const container = document.getElementById('medical-list');

        if (!data || data.length === 0) {
          container.innerHTML = `<p class="text-[#86868b] text-center py-4">目前還沒有醫療紀錄，請在上方新增！</p>`;
          return;
        }

        container.innerHTML = data.map(m => `
          <div class="p-4 bg-[#1c1c1e] rounded-2xl border border-[#38383a] flex justify-between items-center gap-3">
            <div class="flex-1">
              <p class="font-semibold text-white text-sm">${m.title}</p>
              <div class="flex items-center gap-2 mt-1.5 text-[11px] text-[#86868b]">
                <span class="text-amber-400 font-medium">${m.location || '📍 未標示地點'}</span> • <span>${m.event_date}</span>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-amber-400 font-bold bg-amber-400/10 px-3 py-1.5 rounded-xl border border-amber-400/20">${m.cost || ''}</span>
              <button type="button" onclick="deleteMedical(${m.id})" class="text-[11px] text-red-400 bg-red-500/10 px-2.5 py-1.5 rounded-xl border border-red-500/20 cursor-pointer">🗑️ 刪除</button>
            </div>
          </div>
        `).join('');
      } catch(e) { console.log('Load error', e); }
    }

    // 刪除紀錄
    async function deleteMedical(id) {
      if (!confirm("確定要刪除這筆看診紀錄嗎？")) return;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/medical_logs?id=eq.${id}`, {
        method: 'DELETE',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      if (res.ok) loadCloudMedical();
    }

    // 新增紀錄
    document.getElementById('save-medical').onclick = async function() {
      const date = document.getElementById('med-date').value.trim();
      const title = document.getElementById('med-title').value.trim();
      const location = document.getElementById('med-location').value.trim();
      const cost = document.getElementById('med-cost').value.trim();

      if (!date || !title) { alert("請填寫看診日期與診療原因！"); return; }

      const res = await fetch(`${SUPABASE_URL}/rest/v1/medical_logs`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        },
        body: JSON.stringify({ 
          event_date: date, 
          title: title, 
          location: location ? (location.startsWith('📍') ? location : '📍 ' + location) : '📍 未標示地點',
          cost: cost
        })
      });

      if (res.ok) {
        alert("✨ 醫療紀錄已成功儲存至 Supabase 雲端！");
        document.getElementById('med-date').value = '';
        document.getElementById('med-title').value = '';
        document.getElementById('med-location').value = '';
        document.getElementById('med-cost').value = '';
        loadCloudMedical();
      } else {
        alert("⚠️ 儲存失敗，請確定第一步 SQL 已執行！");
      }
    };

    window.onload = loadCloudMedical;
  </script>
</body>
</html>
